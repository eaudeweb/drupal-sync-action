name: 'Synchronize two drupal instances'
description: 'Assumes Github Secrets for nextcloud are set up'
inputs:
  target_ssh_user:
    description: 'Destination SSH user account'
    required: true
  target_ssh_host:
    description: 'Destination SSH host server'
    required: true
  target_ssh_key:
    description: 'Destination SSH private key'
    required: true
  ssh_user_jumphost:
    description: 'SSH user account for jumphost'
    required: false
    default: ''
  ssh_host_jumphost:
    description: 'SSH host server for jumphost'
    required: false
    default: ''
  target_project_dir:
    description: 'Absolute path where the project root is configured (where live symlink exists)'
    required: true
  sync_db:
    description: 'Sync SQL database'
    default: 'true'
  nextcloud_user:
    description: 'Nextcloud username for sync'
    required: false
    default: ''
  nextcloud_app_password:
    description: 'Nextcloud app password for sync'
    required: false
    default: ''
  nextcloud_path:
    description: 'Project folder path in Nextcloud'
    required: false
    default: ''
  nextcloud_base_url:
    description: 'Nextcloud base URL'
    required: false
    default: 'https://drive.eaudeweb.ro'

runs:
  using: "composite"
  steps:
    - name: 'Configure SSH'
      if:  ${{ inputs.ssh_host_jumphost == '' }}
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/server.key
        chmod 600 ~/.ssh/server.key
        cat > ~/.ssh/config <<END
        Host server
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
        END
      env:
        SSH_USER: ${{ inputs.target_ssh_user }}
        SSH_HOST: ${{ inputs.target_ssh_host }}
        SSH_KEY: ${{ inputs.target_ssh_key }}
      shell: bash

    - name: 'Configure SSH'
      if:  ${{ inputs.ssh_host_jumphost != '' }}
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/server.key
        chmod 600 ~/.ssh/server.key
        cat > ~/.ssh/config <<END
        Host jumphost
          HostName $SSH_HOST_JUMPHOST
          User $SSH_USER_JUMPHOST
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
          LogLevel QUIET
        Host server
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/server.key
          StrictHostKeyChecking no
          ProxyJump jumphost
        END
      env:
        SSH_USER: ${{ inputs.target_ssh_user }}
        SSH_HOST: ${{ inputs.target_ssh_host }}
        SSH_KEY: ${{ inputs.target_ssh_key }}
        SSH_USER_JUMPHOST: ${{ inputs.ssh_user_jumphost }}
        SSH_HOST_JUMPHOST: ${{ inputs.ssh_host_jumphost }}
      shell: bash

    - name: 'Synchronize database from source to target'
      if:  ${{ inputs.sync_db == 'true' }}
      run: |
        SOURCE_URL="${NEXTCLOUD_BASE_URL}/remote.php/dav/files/${NEXTCLOUD_USER}/${NEXTCLOUD_PATH}/mysql/database.sql.gz"
        
        # Capture the sync output so we can detect import errors that robo/mysql
        # may not surface via exit code: a dropped connection mid-import prints
        # "ERROR <errno> (<SQLSTATE>) at line <N>" but robo can still exit 0,
        # leaving a silently partial import. We check the exit code AND scan for
        # the mysql client error signature.
        set +e
        ssh server "
          cd ${{ inputs.target_project_dir }} &&
          ./vendor/bin/robo sql:sync \
            -D sites.default.sync.username=\"${NEXTCLOUD_USER}\" \
            -D sites.default.sync.password=\"${NEXTCLOUD_APP_PASSWORD}\" \
            -D sites.default.sql.sync.source=\"${SOURCE_URL}\"
        " 2>&1 | tee sync.log
        rc=${PIPESTATUS[0]}
        set -e

        if [ "$rc" -ne 0 ]; then
          echo "::error::Database sync failed (ssh/robo exit code $rc)"
          exit 1
        fi

        # mysql prints every import error as: ERROR <errno> (<SQLSTATE>) at line <N>: ...
        # Match the format (5-char SQLSTATE), not a specific message, so any import
        # error is caught even when robo masks the exit code.
        if grep -qE 'ERROR [0-9]+ \([0-9A-Z]{5}\)' sync.log; then
          echo "::error::Database import reported an error (possible partial import):"
          grep -nE 'ERROR [0-9]+ \([0-9A-Z]{5}\)' sync.log || true
          exit 1
        fi
      env:
        NEXTCLOUD_USER: ${{ inputs.nextcloud_user }}
        NEXTCLOUD_APP_PASSWORD: ${{ inputs.nextcloud_app_password }}
        NEXTCLOUD_PATH: ${{ inputs.nextcloud_path }}
        NEXTCLOUD_BASE_URL: ${{ inputs.nextcloud_base_url }}
      shell: bash
